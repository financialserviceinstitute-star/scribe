{t:"Process Over Outcome",figs:[{after:2,img:uri(cs(H.concat([[15.5,16,12,15.8],[15.8,17.5,15.6,17.2]]))),cap:"Figure 1. Three red candles, a rejection, then recovery.",align:"c"},{after:3,img:art("b1f2"),cap:"Figure 2. Judge the process.",align:"r",w:"42%"}],body:"A good trade is one that followed your plan, whatever the result. A losing trade taken by the rules is a good decision; a winning trade taken on impulse is a bad habit that happened to pay.\n\nMost traders judge themselves by the last outcome. Professionals judge themselves by the quality of the process: was the setup valid, was the risk defined, was the exit planned before the entry?\n\nLook at the chart in Figure 1. Many traders will remember only whether they made money. The disciplined trader asks whether the entry matched the plan.\n\nTrack decisions, not just profits. After every trade write one line: did I follow my rules? Over fifty trades, that single line tells you more than your profit and loss ever will.\n\nIn the next chapter we look at the pause: the few seconds between impulse and action that separate a plan from a reaction."},
